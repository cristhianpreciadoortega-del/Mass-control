
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mass Control</title>

<style>
:root {
  font-family: Arial, sans-serif;
  color: #182536;
  background: #f1f5f9;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

body { margin: 0; }

header {
  background: #102a43;
  color: white;
  padding: 22px;
}

header h1 {
  margin: 0;
  font-size: 26px;
}

header p {
  margin: 7px 0 0;
  opacity: .85;
}

main {
  max-width: 1050px;
  margin: 25px auto;
  padding: 0 16px;
}

.card {
  background: white;
  border-radius: 15px;
  padding: 23px;
  margin-bottom: 17px;
  box-shadow: 0 3px 15px #0000000a;
}

.login {
  max-width: 460px;
  margin: 55px auto;
}

h2 { margin-top: 0; }

label {
  display: block;
  font-weight: bold;
  margin-bottom: 7px;
}

input, select {
  display: block;
  width: 100%;
  padding: 13px;
  margin-bottom: 17px;
  font: inherit;
  border: 1px solid #cbd5e1;
  border-radius: 9px;
  background: white;
  color: #182536;
}

input:focus, select:focus {
  outline: 2px solid #176b50;
  outline-offset: 1px;
}

button {
  padding: 12px 17px;
  border: 0;
  border-radius: 9px;
  background: #176b50;
  color: white;
  font: inherit;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .55;
  cursor: not-allowed;
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}

.logout { background: #334155; }

.tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  margin: 20px 0;
}

.tabs button { background: #455d75; }
.tabs button.active { background: #176b50; }

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.stat {
  padding: 18px;
  border-radius: 12px;
  background: #eaf1f6;
}

.stat strong {
  display: block;
  font-size: 30px;
  margin-top: 8px;
}

.item {
  padding: 18px 0;
  border-bottom: 1px solid #e2e8f0;
}

.item:last-child { border-bottom: 0; }

.item-head {
  display: flex;
  justify-content: space-between;
  gap: 12px;
}

.item strong { line-height: 1.5; }

.item p {
  color: #475569;
  line-height: 1.7;
  font-size: 14px;
  margin-bottom: 0;
}

.tag {
  padding: 6px 9px;
  border-radius: 7px;
  background: #e2e8f0;
  font-size: 11px;
  font-weight: bold;
  white-space: nowrap;
  align-self: flex-start;
}

.tag.danger {
  background: #fee2e2;
  color: #991b1b;
}

.tag.warn {
  background: #fef3c7;
  color: #92400e;
}

.tag.ok {
  background: #dcfce7;
  color: #166534;
}

.message {
  min-height: 20px;
  margin: 12px 0;
}

.error { color: #b91c1c; }
.success { color: #166534; }

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0 16px;
}

.full { grid-column: 1 / -1; }

.checkline {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 5px 0 22px;
}

.checkline input {
  width: 20px;
  height: 20px;
  margin: 0;
}

.checkline label { margin: 0; }

.hint {
  font-size: 13px;
  color: #64748b;
  line-height: 1.6;
}

@media (max-width: 650px) {
  .stats { grid-template-columns: 1fr 1fr; }
  .form-grid { grid-template-columns: 1fr; }
  .card { padding: 17px; }
  .topbar { flex-wrap: wrap; }
  .item-head { flex-direction: column; }
  header h1 { font-size: 22px; }
  .tabs button { flex-grow: 1; }
}
</style>
</head>

<body>

<header>
  <h1>MASS CONTROL</h1>
  <p>Gestión de caducidades y productos</p>
</header>

<main>

  <!-- INICIO DE SESION -->

  <section id="loginPanel" class="card login">
    <h2>Iniciar sesión</h2>

    <form id="loginForm">
      <label for="usuario">Usuario</label>
      <input id="usuario"
             autocomplete="username"
             required>

      <label for="contrasena">Contraseña</label>
      <input id="contrasena"
             type="password"
             autocomplete="current-password"
             required>

      <button id="entrar" type="submit">
        Entrar a Mass Control
      </button>
    </form>

    <p id="loginError" class="message error"
       role="alert"></p>
  </section>

  <!-- PANEL PRINCIPAL -->

  <section id="panel" hidden>

    <div class="card topbar">
      <div>
        <strong id="cuenta"></strong>
        <p id="rol"></p>
      </div>

      <button id="salir" class="logout">
        Salir
      </button>
    </div>

    <!-- INDICADORES -->

    <section id="estadisticas" class="stats">
      <div class="stat">
        Urgentes
        <strong id="urgentes">0</strong>
      </div>

      <div class="stat">
        Vencidas o de hoy
        <strong id="vencidas">0</strong>
      </div>

      <div class="stat">
        Total próximas
        <strong id="total">0</strong>
      </div>
    </section>

    <!-- MENU -->

    <nav class="tabs" aria-label="Secciones">
      <button type="button"
              data-tab="proximas"
              class="active">
        Próximas
      </button>

      <button type="button"
              data-tab="registradas">
        Alertas guardadas
      </button>

      <button type="button"
              data-tab="historial">
        Historial
      </button>

      <button type="button"
              data-tab="productos">
        Productos
      </button>

      <button type="button"
              data-tab="nuevo">
        Nuevo producto
      </button>
    </nav>

    <!-- SECCIONES DE CONSULTA -->

    <section id="consultaPanel" class="card">

      <div class="topbar">
        <h2 id="titulo">Próximas caducidades</h2>

        <button type="button" id="actualizar">
          Actualizar
        </button>
      </div>

      <p id="estado" role="status"
         aria-live="polite"></p>

      <div id="contenido"></div>

    </section>

    <!-- FORMULARIO REAL DE PRODUCTOS -->

    <section id="nuevoPanel" class="card" hidden>

      <h2>Registrar nuevo producto</h2>

      <p class="hint">
        El producto se guardará únicamente después
        de pulsar Registrar y confirmar la operación.
      </p>

      <form id="productoForm">

        <div class="form-grid">

          <div>
            <label for="codigoInterno">
              Código interno *
            </label>

            <input id="codigoInterno"
                   type="text"
                   maxlength="100"
                   autocomplete="off"
                   required
                   placeholder="Código del producto">
          </div>

          <div>
            <label for="codigoBarras">
              Código de barras (opcional)
            </label>

            <input id="codigoBarras"
                   type="text"
                   maxlength="100"
                   autocomplete="off"
                   placeholder="EAN del producto">
          </div>

          <div class="full">
            <label for="descripcion">
              Descripción del producto *
            </label>

            <input id="descripcion"
                   type="text"
                   maxlength="500"
                   required
                   placeholder="Nombre, marca, peso o formato">
          </div>

          <div class="full">
            <label for="familia">
              Familia *
            </label>

            <select id="familia" required>
              <option value="">
                Selecciona una familia
              </option>
            </select>
          </div>

          <div id="adminTienda" class="full" hidden>
            <label for="tiendaId">
              ID de la tienda *
            </label>

            <input id="tiendaId"
                   type="number"
                   min="1"
                   step="1"
                   placeholder="ID de la tienda">

            <p class="hint">
              Campo exclusivo del administrador.
            </p>
          </div>

          <div class="full checkline">
            <input type="checkbox"
                   id="controlaFecha"
                   checked>

            <label for="controlaFecha">
              Controlar fecha de caducidad
            </label>
          </div>

        </div>

        <button type="submit" id="registrarProducto">
          Registrar producto
        </button>

      </form>

      <p id="mensajeProducto"
         class="message"
         role="status"
         aria-live="polite"></p>

    </section>

  </section>

</main>

<script>
"use strict";

// ========================================
// ESTADO DE LA APLICACION
// ========================================

let token = null;
let perfilActual = null;
let seccion = "proximas";
let versionCarga = 0;

const $ = id => document.getElementById(id);

// ========================================
// CONSULTAS A LA API
// ========================================

async function solicitar(ruta, opciones = {}) {
  const headers = {
    ...(opciones.body
      ? { "Content-Type": "application/json" }
      : {}),
    ...(token
      ? { Authorization: "Bearer " + token }
      : {})
  };

  const respuesta = await fetch(ruta, {
    ...opciones,
    headers,
    cache: "no-store"
  });

  const datos = await respuesta.json()
    .catch(() => ({}));

  if (!respuesta.ok) {
    if (respuesta.status === 401 && token) {
      cerrarSesion();
    }

    throw new Error(
      datos.error || "Error HTTP " + respuesta.status
    );
  }

  return datos;
}

// ========================================
// INICIO DE SESION
// ========================================

$("loginForm").addEventListener(
  "submit",
  async evento => {
    evento.preventDefault();

    $("entrar").disabled = true;
    $("loginError").textContent = "";

    try {
      const datos = await solicitar(
        "/api/auth/login",
        {
          method: "POST",
          body: JSON.stringify({
            usuario: $("usuario").value.trim(),
            contrasena: $("contrasena").value
          })
        }
      );

      if (!datos.token) {
        throw new Error("No se recibio la sesion");
      }

      token = datos.token;

      const perfil = await solicitar("/api/auth/me");

      perfilActual = perfil;

      $("cuenta").textContent = perfil.usuario;

      $("rol").textContent =
        perfil.rol === "ADMIN"
          ? "Administrador - Todas las tiendas"
          : "Tienda ID: " + perfil.tienda_id;

      $("adminTienda").hidden =
        perfil.rol !== "ADMIN";

      $("tiendaId").required =
        perfil.rol === "ADMIN";

      $("contrasena").value = "";

      $("loginPanel").hidden = true;
      $("panel").hidden = false;

      await cambiarSeccion("proximas");

    } catch (error) {
      if (!$("loginPanel").hidden) {
        token = null;
        perfilActual = null;
        $("loginError").textContent = error.message;
      }
    } finally {
      $("entrar").disabled = false;
    }
  }
);

// ========================================
// CERRAR SESION
// ========================================

function cerrarSesion() {
  versionCarga++;
  token = null;
  perfilActual = null;

  $("loginPanel").hidden = false;
  $("panel").hidden = true;

  $("contrasena").value = "";
  $("productoForm").reset();
  $("mensajeProducto").textContent = "";
  $("contenido").replaceChildren();
}

$("salir").addEventListener("click", cerrarSesion);

// ========================================
// ETIQUETAS Y TARJETAS
// ========================================

function estiloEstado(valor) {
  if (
    ["VENCIDO", "VENCE_HOY", "URGENTE"]
      .includes(valor)
  ) {
    return "danger";
  }

  if (
    ["PRIMERA", "PENDIENTE", "SIN_POLITICA"]
      .includes(valor)
  ) {
    return "warn";
  }

  if (
    ["REVISADA", "CERRADA", "ACTIVO"]
      .includes(valor)
  ) {
    return "ok";
  }

  return "";
}

function agregarElemento(titulo, detalle, etiqueta) {
  const item = document.createElement("article");
  item.className = "item";

  const cabecera = document.createElement("div");
  cabecera.className = "item-head";

  const nombre = document.createElement("strong");
  nombre.textContent = titulo || "Sin descripcion";

  const estado = document.createElement("span");
  estado.className =
    "tag " + estiloEstado(etiqueta);

  estado.textContent = etiqueta || "REGISTRO";

  cabecera.append(nombre, estado);

  const descripcion = document.createElement("p");
  descripcion.textContent = detalle;

  item.append(cabecera, descripcion);
  $("contenido").appendChild(item);
}

// ========================================
// CAMBIAR DE SECCION
// ========================================

async function cambiarSeccion(nombre) {
  seccion = nombre;
  versionCarga++;

  document.querySelectorAll("[data-tab]")
    .forEach(boton => {
      boton.classList.toggle(
        "active",
        boton.dataset.tab === nombre
      );
    });

  const esFormulario = nombre === "nuevo";

  $("nuevoPanel").hidden = !esFormulario;
  $("consultaPanel").hidden = esFormulario;

  $("estadisticas").hidden =
    nombre !== "proximas";

  if (esFormulario) {
    await cargarFamilias();
  } else {
    await cargar();
  }
}

document.querySelectorAll("[data-tab]")
  .forEach(boton => {
    boton.addEventListener("click", () => {
      cambiarSeccion(boton.dataset.tab);
    });
  });

// ========================================
// CONSULTAR PROXIMAS, ALERTAS,
// HISTORIAL Y PRODUCTOS
// ========================================

async function cargar() {
  if (!token) return;

  const miVersion = ++versionCarga;

  $("contenido").replaceChildren();
  $("estado").textContent =
    "Consultando Mass Control...";

  try {
    let datos;
    let lista = [];

    if (seccion === "proximas") {
      $("titulo").textContent =
        "Próximas caducidades";

      datos = await solicitar("/api/alertas/proximas");
      lista = datos.alertas || [];

      if (miVersion !== versionCarga) return;

      $("total").textContent = lista.length;

      $("urgentes").textContent =
        lista.filter(a =>
          a.tipo_alerta === "URGENTE"
        ).length;

      $("vencidas").textContent =
        lista.filter(a =>
          ["VENCIDO", "VENCE_HOY"]
            .includes(a.tipo_alerta)
        ).length;

      lista.forEach(a => agregarElemento(
        a.descripcion,
        "Código: " + a.codigo_interno +
        " · Caducidad: " + a.fecha_caducidad +
        " · Cantidad: " + a.cantidad +
        " · Lote: " + a.lote_id,
        a.tipo_alerta
      ));
    }

    else if (seccion === "registradas") {
      $("titulo").textContent =
        "Alertas registradas";

      datos = await solicitar(
        "/api/alertas/registradas"
      );

      lista = datos.alertas || [];

      if (miVersion !== versionCarga) return;

      lista.forEach(a => agregarElemento(
        a.descripcion,
        "Código: " + a.codigo_interno +
        " · Caducidad: " + a.fecha_caducidad +
        " · Cantidad: " + a.cantidad +
        " · Tipo: " + a.tipo,
        a.estado
      ));
    }

    else if (seccion === "historial") {
      $("titulo").textContent =
        "Historial de movimientos";

      datos = await solicitar(
        "/api/historial?limite=50"
      );

      lista = datos.movimientos || [];

      if (miVersion !== versionCarga) return;

      lista.forEach(m => agregarElemento(
        m.descripcion || ("Lote " + m.lote_id),
        "Movimiento: " + m.accion +
        " · Cuenta: " + (m.cuenta || "Sin identificar") +
        " · Fecha: " + m.registrado_en,
        m.accion
      ));
    }

    else if (seccion === "productos") {
      $("titulo").textContent =
        "Productos registrados";

      datos = await solicitar("/api/productos");
      lista = datos.productos || [];

      if (miVersion !== versionCarga) return;

      lista.forEach(p => agregarElemento(
        p.descripcion,
        "Código: " + p.codigo_interno +
        " · Barras: " + (p.codigo_barras || "Sin código") +
        " · Familia: " + (p.familia || "Sin asignar") +
        " · Tienda: " + p.tienda_id +
        " · ID: " + p.id,
        p.activo ? "ACTIVO" : "INACTIVO"
      ));
    }

    if (miVersion !== versionCarga) return;

    $("estado").textContent =
      lista.length
        ? lista.length + " registros encontrados"
        : "No hay registros en esta sección.";

  } catch (error) {
    if (miVersion === versionCarga) {
      $("estado").textContent = error.message;
    }
  }
}

$("actualizar").addEventListener("click", cargar);

// ========================================
// CARGAR FAMILIAS REALES
// ========================================

async function cargarFamilias() {
  if (!token) return;

  const miVersion = versionCarga;
  const selector = $("familia");

  selector.replaceChildren();

  const inicial = document.createElement("option");
  inicial.value = "";
  inicial.textContent = "Cargando familias...";
  selector.appendChild(inicial);

  $("registrarProducto").disabled = true;
  $("mensajeProducto").textContent = "";

  try {
    const datos = await solicitar(
      "/api/productos/familias"
    );

    if (
      miVersion !== versionCarga ||
      seccion !== "nuevo"
    ) return;

    const familias = Array.isArray(datos)
      ? datos
      : datos.familias || [];

    selector.replaceChildren();

    const opcion = document.createElement("option");
    opcion.value = "";
    opcion.textContent = "Selecciona una familia";
    selector.appendChild(opcion);

    familias.forEach(f => {
      const nueva = document.createElement("option");
      nueva.value = String(f.id);
      nueva.textContent = f.nombre +
        (f.codigo ? " (" + f.codigo + ")" : "");

      selector.appendChild(nueva);
    });

    if (!familias.length) {
      throw new Error(
        "No hay familias disponibles"
      );
    }

    $("registrarProducto").disabled = false;

  } catch (error) {
    if (miVersion === versionCarga) {
      $("mensajeProducto").className =
        "message error";

      $("mensajeProducto").textContent =
        "No se pudieron cargar las familias: " +
        error.message;
    }
  }
}

// ========================================
// REGISTRAR PRODUCTO REAL
// ========================================

$("productoForm").addEventListener(
  "submit",
  async evento => {
    evento.preventDefault();

    if (!token || !perfilActual) return;

    const codigo =
      $("codigoInterno").value.trim();

    const descripcion =
      $("descripcion").value.trim();

    const barras =
      $("codigoBarras").value.trim();

    const familia =
      $("familia").value;

    const controlaFecha =
      $("controlaFecha").checked;

    const tienda =
      $("tiendaId").value.trim();

    if (
      !codigo ||
      codigo.length > 100 ||
      !descripcion ||
      descripcion.length > 500 ||
      barras.length > 100 ||
      !/^[1-9]\d*$/.test(familia)
    ) {
      $("mensajeProducto").className =
        "message error";

      $("mensajeProducto").textContent =
        "Revisa los datos obligatorios.";

      return;
    }

    if (
      perfilActual.rol === "ADMIN" &&
      !/^[1-9]\d*$/.test(tienda)
    ) {
      $("mensajeProducto").className =
        "message error";

      $("mensajeProducto").textContent =
        "Introduce una tienda valida.";

      return;
    }

    const datos = {
      codigo_interno: codigo,
      descripcion: descripcion,
      codigo_barras: barras || null,
      familia_id: Number(familia),
      controla_fecha: controlaFecha
    };

    if (perfilActual.rol === "ADMIN") {
      datos.tienda_id = Number(tienda);
    }

    const nombreFamilia =
      $("familia").selectedOptions[0]?.textContent
      || "Sin familia";

    const confirmado = window.confirm(
      "¿Registrar este producto en Mass Control?\n\n" +
      "Código: " + codigo + "\n" +
      "Descripción: " + descripcion + "\n" +
      "Familia: " + nombreFamilia + "\n\n" +
      "La operación guardará el producto en PostgreSQL."
    );

    if (!confirmado) return;

    const boton = $("registrarProducto");
    boton.disabled = true;

    $("mensajeProducto").className = "message";
    $("mensajeProducto").textContent =
      "Guardando producto...";

    try {
      const resultado = await solicitar(
        "/api/productos",
        {
          method: "POST",
          body: JSON.stringify(datos)
        }
      );

      if (!resultado.producto?.id) {
        throw new Error(
          "El servidor no devolvio el producto creado"
        );
      }

      $("mensajeProducto").className =
        "message success";

      $("mensajeProducto").textContent =
        "PRODUCTO REGISTRADO CORRECTAMENTE. " +
        "ID: " + resultado.producto.id +
        " · Código: " +
        resultado.producto.codigo_interno;

      $("productoForm").reset();
      $("familia").value = "";

    } catch (error) {
      $("mensajeProducto").className =
        "message error";

      $("mensajeProducto").textContent =
        "No se pudo registrar: " + error.message;

    } finally {
      if (token) {
        boton.disabled = false;
      }
    }
  }
);

</script>
</body>
</html>
