
name: Alertas diarias Mass Control

on:
  schedule:
    - cron: '7 9 * * *'
      timezone: 'Europe/Madrid'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mass-control-alertas
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      MASS_PASSWORD: ${{ secrets.MASS_TIENDA_PASSWORD }}
      MASS_API: https://mass-control-1.onrender.com

    steps:
      - name: Comprobar acceso y sincronizar alertas
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${MASS_PASSWORD:-}" ]; then
            echo "::error::Falta MASS_TIENDA_PASSWORD"
            exit 1
          fi

          login_file=$(mktemp)
          sync_file=$(mktemp)

          trap 'rm -f "$login_file" "$sync_file"' EXIT

          login=$(jq -nc \
            --arg usuario "tienda_mass_001" \
            --arg contrasena "$MASS_PASSWORD" \
            '{usuario:$usuario,contrasena:$contrasena}')

          unset MASS_PASSWORD

          codigo_login=$(curl -sS \
            --max-time 120 \
            -o "$login_file" \
            -w '%{http_code}' \
            -X POST \
            "$MASS_API/api/auth/login" \
            -H "Content-Type: application/json" \
            --data "$login")

          unset login

          echo "Inicio de sesion: HTTP $codigo_login"

          if [ "$codigo_login" != "200" ]; then
            echo "::error::Fallo de autenticacion HTTP $codigo_login"
            exit 1
          fi

          token=$(jq -er '.token' "$login_file")

          codigo_sync=$(curl -sS \
            --max-time 120 \
            -o "$sync_file" \
            -w '%{http_code}' \
            -X POST \
            "$MASS_API/api/alertas/sincronizar" \
            -H "Authorization: Bearer $token")

          unset token

          echo "Sincronizacion: HTTP $codigo_sync"

          if [ "$codigo_sync" != "200" ]; then
            echo "::error::Fallo de sincronizacion HTTP $codigo_sync"
            exit 1
          fi

          echo "ALERTAS SINCRONIZADAS CORRECTAMENTE"

          jq '{mensaje, nuevas}' "$sync_file"
